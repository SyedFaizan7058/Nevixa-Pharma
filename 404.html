    <style>
        :root {
            --nvx-navy: #0B2545;
            --nvx-navy-deep: #071A33;
            --nvx-teal: #0F8B8D;
            --nvx-teal-light: #E4F3F2;
            --nvx-muted: #5B6673;
            --nvx-font-display: 'Fraunces', serif;
            --nvx-font-body: 'Inter', sans-serif;
            --nvx-font-mono: 'JetBrains Mono', monospace;
        }

        .nvx-404 {
            position: relative;
            background: var(--nvx-navy-deep);
            background-image: radial-gradient(circle at 1px 1px, rgba(255, 255, 255, 0.10) 1.5px, transparent 0);
            background-size: 26px 26px;
            min-height: 70vh;
            display: flex;
            align-items: center;
            overflow: hidden;
            font-family: var(--nvx-font-body);
            padding: 4rem 0;
        }

        .nvx-404::after {
            content: "";
            position: absolute;
            right: -120px;
            top: -120px;
            width: 420px;
            height: 420px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(15, 139, 141, 0.32), transparent 70%);
        }

        .nvx-404-inner {
            position: relative;
            z-index: 1;
            max-width: 640px;
            margin: 0 auto;
            text-align: center;
        }

        .nvx-404-code {
            font-family: var(--nvx-font-display);
            font-size: clamp(5rem, 14vw, 8.5rem);
            font-weight: 600;
            color: #fff;
            line-height: 1;
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
        }

        .nvx-404-code em {
            color: var(--nvx-teal);
            font-style: normal;
        }

        .nvx-eyebrow {
            font-family: var(--nvx-font-mono);
            font-size: 0.72rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--nvx-teal);
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            border: 1px solid var(--nvx-teal);
            padding: 0.3rem 0.75rem;
            border-radius: 999px;
            background: rgba(15, 139, 141, 0.12);
            margin-bottom: 1.25rem;
        }

        .nvx-404 h1 {
            font-family: var(--nvx-font-display);
            color: #fff;
            font-weight: 600;
            font-size: clamp(1.5rem, 3vw, 2rem);
            margin-bottom: 1rem;
        }

        .nvx-404 p {
            color: rgba(255, 255, 255, 0.72);
            font-size: 1.02rem;
            line-height: 1.7;
            margin-bottom: 2.25rem;
        }

        .nvx-404-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.9rem;
            justify-content: center;
            margin-bottom: 3rem;
        }

        .nvx-btn-primary {
            font-weight: 600;
            background: var(--nvx-teal);
            color: #fff;
            padding: 0.85rem 1.6rem;
            border-radius: 8px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .nvx-btn-primary:hover {
            background: #0c7274;
            transform: translateY(-2px);
            color: #fff;
        }

        .nvx-btn-secondary {
            font-weight: 600;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 0.85rem 1.6rem;
            border-radius: 8px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: border-color 0.2s ease, background 0.2s ease;
        }

        .nvx-btn-secondary:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: #fff;
            color: #fff;
        }

        .nvx-quick-links {
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            padding-top: 1.75rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0 1.75rem;
            justify-content: center;
        }

        .nvx-quick-links a {
            font-family: var(--nvx-font-mono);
            font-size: 0.82rem;
            color: rgba(255, 255, 255, 0.75);
            text-decoration: none;
        }

        .nvx-quick-links a:hover {
            color: var(--nvx-teal);
        }

        @media (prefers-reduced-motion: reduce) {

            .nvx-btn-primary,
            .nvx-btn-secondary {
                transition: none;
            }
        }
